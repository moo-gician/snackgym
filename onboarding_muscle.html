<!-- Content Container -->

<h1 class="font-headline-lg text-4xl font-bold text-on-surface uppercase tracking-tighter text-center max-w-md mx-auto">

<p class="font-label-bold text-primary-container mt-4 text-center uppercase tracking-widest text-lg">
        Select target zones to calibrate B.E.A.S.T protocol
      </p>
</header>
<!-- Body Silhouette Container -->
<div class="relative flex-1 flex justify-center items-center py-4 min-h-[400px]">
<!-- Ambient Grid Background -->
<div class="absolute inset-0 pointer-events-none opacity-20">

<pattern height="40" id="grid" patternUnits="userSpaceOnUse" width="40">
<path class="text-primary" d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>

</svg>
</div>
<!-- Human Body Map Image -->
<div class="relative w-full max-w-[320px] aspect-[848/1264] mx-auto z-10">
<img alt="Warrior Muscle Map" class="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(200,154,81,0.1)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBp91qYJ0ZDXVd73s-6NDwPG7PoTpae0qkUmFFVfTUYFfrPYUy9wUrcP3Ih6DiYQb7-ZEH61_xW5fwn6Z2A1EsVIO85W7wN6WN-QOGLCTNfzQ3D7wgyyxB5HxebZ2zj7z-9OjMRM_FOQCZf_71vcfKpYh25ET7gabC3JkARtO2SuQi-Rt3oWJ2mXMbO9bhL8qmGMDhYlciDxtEXGMMupmlLpVXZAjW4zkDLtBrzTj-6YYAm9YFvP3vZ">
<svg class="absolute inset-0 w-full h-full" preserveAspectRatio="none" viewBox="0 0 848 1264">
<!-- Interactive Muscle Zones -->
<!-- Shoulders -->
<g class="muscle-group cursor-pointer hover:opacity-80 transition-opacity" data-zone="shoulders" onclick="toggleMuscle('shoulders')">
<path class="text-surface-variant/0 transition-colors duration-200 fill-current" d="M 330 380 L 518 380 L 590 480 L 258 480 Z" id="zone-shoulders"></path>
</g>
<!-- Chest -->
<g class="muscle-group cursor-pointer hover:opacity-80 transition-opacity" data-zone="chest" onclick="toggleMuscle('chest')">

</g>
<!-- Core -->
<g class="muscle-group cursor-pointer hover:opacity-80 transition-opacity" data-zone="core" onclick="toggleMuscle('core')">
<path class="text-surface-variant/0 transition-colors duration-200 fill-current" d="M 318 620 L 530 620 L 500 780 L 348 780 Z" id="zone-core"></path>
</g>

<g class="muscle-group cursor-pointer hover:opacity-80 transition-opacity" data-zone="arms" onclick="toggleMuscle('arms')">

<!-- Floating Labels -->
<div class="absolute top-[28%] left-2 z-20">
<button class="muscle-btn group bg-surface-container border border-outline-variant px-3 py-1 font-label-bold text-label-sm text-on-surface uppercase rounded-none transition-all shadow-[0_0_10px_rgba(0,0,0,0.5)]" data-target="shoulders" onclick="toggleMuscle('shoulders')">
      Shoulders
      <div class="absolute -right-6 top-1/2 w-6 h-[1px] bg-outline-variant"></div>
</button>
</div>
<div class="absolute top-[40%] right-2 z-20">
<button class="muscle-btn group bg-surface-container border border-outline-variant px-3 py-1 font-label-bold text-label-sm text-on-surface uppercase rounded-none transition-all shadow-[0_0_10px_rgba(0,0,0,0.5)]" data-target="chest" onclick="toggleMuscle('chest')">
<div class="absolute -left-6 top-1/2 w-6 h-[1px] bg-outline-variant"></div>
      Chest
    </button>
</div>
<div class="absolute top-[52%] left-2 z-20">
<button class="muscle-btn group bg-surface-container border border-outline-variant px-3 py-1 font-label-bold text-label-sm text-on-surface uppercase rounded-none transition-all shadow-[0_0_10px_rgba(0,0,0,0.5)]" data-target="core" onclick="toggleMuscle('core')">
      Core
      <div class="absolute -right-6 top-1/2 w-6 h-[1px] bg-outline-variant"></div>
</button>
</div>
<div class="absolute top-[48%] right-2 z-20">
<button class="muscle-btn group bg-surface-container border border-outline-variant px-3 py-1 font-label-bold text-label-sm text-on-surface uppercase rounded-none transition-all shadow-[0_0_10px_rgba(0,0,0,0.5)]" data-target="arms" onclick="toggleMuscle('arms')">
<div class="absolute -left-6 top-1/2 w-6 h-[1px] bg-outline-variant"></div>
      Arms
    </button>
</div>
<div class="absolute top-[70%] left-2 z-20">
<button class="muscle-btn group bg-surface-container border border-outline-variant px-3 py-1 font-label-bold text-label-sm text-on-surface uppercase rounded-none transition-all shadow-[0_0_10px_rgba(0,0,0,0.5)]" data-target="legs" onclick="toggleMuscle('legs')">
      Legs
      <div class="absolute -right-6 top-1/2 w-6 h-[1px] bg-outline-variant"></div>
</button>
</div>
</div>
</div>
<!-- Selected Target Summary -->

</div>
</div>
<script>
  const selectedZones = new Set();
  
  function toggleMuscle(zone) {
    const isSelected = selectedZones.has(zone);
    
    // Toggle state
    if (isSelected) {
      selectedZones.delete(zone);
    } else {
      selectedZones.add(zone);
    }
    
    updateUI();
  }

  function updateUI() {
    // Reset all buttons and SVG zones
    document.querySelectorAll('.muscle-btn').forEach(btn => {
      btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary', 'shadow-[0_0_15px_rgba(240,190,113,0.3)]');
      btn.classList.add('bg-surface-container', 'text-on-surface', 'border-outline-variant');
    });
    
    document.querySelectorAll('[id^="zone-"]').forEach(path => {
      path.classList.remove('text-primary/40');
      path.classList.add('text-surface-variant/0');
    });

    // Apply active styles
    selectedZones.forEach(zone => {
      const btn = document.querySelector(`.muscle-btn[data-target="${zone}"]`);
      if (btn) {
        btn.classList.add('bg-primary', 'text-on-primary', 'border-primary', 'shadow-[0_0_15px_rgba(240,190,113,0.3)]');
        btn.classList.remove('bg-surface-container', 'text-on-surface', 'border-outline-variant');
      }
      
      const paths = document.querySelectorAll(`[id^="zone-${zone}"]`);
      paths.forEach(path => {
        path.classList.add('text-primary/40');
        path.classList.remove('text-surface-variant/0');
      });
    });

    // Update Summary
    document.getElementById('target-count').textContent = selectedZones.size;
    const tagsContainer = document.getElementById('selected-tags');
    
    if (selectedZones.size === 0) {
      tagsContainer.innerHTML = '<span class="text-on-surface-variant font-label-sm text-label-sm italic">Tap muscle groups to select...</span>';
    } else {
      tagsContainer.innerHTML = Array.from(selectedZones).map(zone => 
        `<div class="bg-error-container text-on-error-container px-2 py-1 font-label-bold text-label-sm uppercase rounded-sm flex items-center gap-1 border border-error/30">
          <span class="w-1 h-1 bg-error rounded-full"></span>
          ${zone}
        </div>`
      ).join('');
    }
    
    // Haptic feedback simulation
    if (navigator.vibrate) {
        navigator.vibrate(50);
    }
  }
</script></main><footer class="fixed bottom-0 w-full z-50 bg-surface/90 backdrop-blur-md pb-safe px-margin-mobile border-t border-outline-variant/10"><div class="h-20 flex items-center justify-center px-margin-mobile"><div class="flex items-center bg-surface-container rounded-full p-1 border border-outline-variant/30 shadow-lg w-full max-w-md"><button class="flex-1 flex flex-col items-center justify-center py-2 text-primary"><span class="material-symbols-outlined">swords</span><span class="text-[10px] font-label-bold uppercase tracking-tighter">Arena</span></button><button class="flex-1 flex flex-col items-center justify-center py-2 text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined">history</span><span class="text-[10px] font-label-bold uppercase tracking-tighter">History</span></button><button class="flex-1 flex flex-col items-center justify-center py-2 text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined">settings</span><span class="text-[10px] font-label-bold uppercase tracking-tighter">Settings</span></button></div></div></footer>
