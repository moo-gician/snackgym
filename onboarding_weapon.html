></div><span class="font-label-bold text-label-bold uppercase tracking-widest text-primary-container whitespace-nowrap">Armory Onboarding</span><div class="flex-grow flex items-center gap-2"><div class="onboarding-progress-segment segment-active"></div><div class="onboarding-progress-segment segment-inactive"></div><div class="onboarding-progress-segment segment-inactive"></div><div class="onboarding-progress-segment segment-inactive"></div><div class="onboarding-progress-segment segment-inactive"></div><div class="onboarding-progress-segment segment-inactive"></div></div><button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined">account_circle</span></button></div></header><main class="flex-grow flex flex-col pb-24 px-margin-mobile pt-20"><div class="flex flex-col w-full relative">
<div class="mb-stack-md text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface uppercase tracking-wide leading-tight text-center font-bold">WHAT WEAPONS ARE WE USING?</h1>
<p class="font-label-bold text-body-lg text-primary-container mt-stack-sm mx-auto uppercase text-center">Select your arsenal to calibrate the training protocol.</p>
</div>
<div class="grid grid-cols-2 gap-gutter pb-stack-lg">
<!-- Bodyweight (Selected) -->
<button class="relative w-full aspect-square bg-surface-container rounded border border-primary text-primary flex flex-col items-center justify-center p-gutter shadow-[0_0_15px_rgba(240,190,113,0.2)] transition-all active:scale-[0.98]" onclick="toggleWeapon(this, true)">
<div class="absolute top-0 right-0 w-2 h-2 bg-primary"></div>
<span class="material-symbols-outlined text-[48px] mb-stack-sm" style="font-variation-settings: 'FILL' 1;">accessibility_new</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest text-center">Bodyweight</span>
</button>
<!-- Dumbbells -->
<button class="relative w-full aspect-square bg-surface-container rounded border border-outline-variant text-on-surface-variant flex flex-col items-center justify-center p-gutter transition-all active:scale-[0.98] hover:shadow-[0_0_15px_rgba(240,190,113,0.2)] hover:border-primary hover:text-primary" onclick="toggleWeapon(this, false)">
<div class="absolute top-0 right-0 w-2 h-2 bg-outline-variant transition-colors group-hover:bg-primary corner-accent"></div>
<span class="material-symbols-outlined text-[48px] mb-stack-sm">fitness_center</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest text-center">Dumbbells</span>
</button>
<!-- Pull-up Bar -->
<button class="relative w-full aspect-square bg-surface-container rounded border border-outline-variant text-on-surface-variant flex flex-col items-center justify-center p-gutter transition-all active:scale-[0.98] hover:shadow-[0_0_15px_rgba(240,190,113,0.2)] hover:border-primary hover:text-primary" onclick="toggleWeapon(this, false)">
<div class="absolute top-0 right-0 w-2 h-2 bg-outline-variant transition-colors group-hover:bg-primary corner-accent"></div>
<span class="material-symbols-outlined text-[48px] mb-stack-sm">horizontal_rule</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest text-center">Pull-up Bar</span>
</button>
<!-- Yoga Mat -->
<button class="relative w-full aspect-square bg-surface-container rounded border border-outline-variant text-on-surface-variant flex flex-col items-center justify-center p-gutter transition-all active:scale-[0.98] hover:shadow-[0_0_15px_rgba(240,190,113,0.2)] hover:border-primary hover:text-primary" onclick="toggleWeapon(this, false)">
<div class="absolute top-0 right-0 w-2 h-2 bg-outline-variant transition-colors group-hover:bg-primary corner-accent"></div>
<span class="material-symbols-outlined text-[48px] mb-stack-sm">panorama_horizontal</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest text-center">Yoga Mat</span>
</button>
<!-- Resistance Band -->
<button class="relative w-full aspect-square bg-surface-container rounded border border-outline-variant text-on-surface-variant flex flex-col items-center justify-center p-gutter transition-all active:scale-[0.98] hover:shadow-[0_0_15px_rgba(240,190,113,0.2)] hover:border-primary hover:text-primary" onclick="toggleWeapon(this, false)">
<div class="absolute top-0 right-0 w-2 h-2 bg-outline-variant transition-colors group-hover:bg-primary corner-accent"></div>
<span class="material-symbols-outlined text-[48px] mb-stack-sm">loop</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest text-center">Resistance Band</span>
</button>
<!-- Barbell -->
<button class="relative w-full aspect-square bg-surface-container rounded border border-outline-variant text-on-surface-variant flex flex-col items-center justify-center p-gutter transition-all active:scale-[0.98] hover:shadow-[0_0_15px_rgba(240,190,113,0.2)] hover:border-primary hover:text-primary" onclick="toggleWeapon(this, false)">
<div class="absolute top-0 right-0 w-2 h-2 bg-outline-variant transition-colors group-hover:bg-primary corner-accent"></div>
<span class="material-symbols-outlined text-[48px] mb-stack-sm">sports_gymnastics</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest text-center">Barbell</span>
</button>
<!-- Bench -->
<button class="relative w-full aspect-square bg-surface-container rounded border border-outline-variant text-on-surface-variant flex flex-col items-center justify-center p-gutter transition-all active:scale-[0.98] hover:shadow-[0_0_15px_rgba(240,190,113,0.2)] hover:border-primary hover:text-primary" onclick="toggleWeapon(this, false)">
<div class="absolute top-0 right-0 w-2 h-2 bg-outline-variant transition-colors group-hover:bg-primary corner-accent"></div>
<span class="material-symbols-outlined text-[48px] mb-stack-sm">event_seat</span>
<span class="font-label-bold text-label-bold uppercase tracking-widest text-center">Bench</span>
</button>
</div>
<script>
        function toggleWeapon(btn, isInitialSelection) {
            const isSelected = btn.classList.contains('border-primary');
            const icon = btn.querySelector('.material-symbols-outlined');
            const corner = btn.querySelector('div.absolute');
            
            if (isInitialSelection && isSelected) {
                // Prevent unselecting the primary default immediately, or just allow toggling
            }

            if (isSelected) {
                btn.classList.remove('border-primary', 'text-primary', 'shadow-[0_0_15px_rgba(240,190,113,0.2)]');
                btn.classList.add('border-outline-variant', 'text-on-surface-variant');
                icon.style.fontVariationSettings = "'FILL' 0";
                if(corner) corner.classList.replace('bg-primary', 'bg-outline-variant');
            } else {
                btn.classList.add('border-primary', 'text-primary', 'shadow-[0_0_15px_rgba(240,190,113,0.2)]');
                btn.classList.remove('border-outline-variant', 'text-on-surface-variant');
                icon.style.fontVariationSettings = "'FILL' 1";
                if(corner) corner.classList.replace('bg-outline-variant', 'bg-primary');
                
                // Haptic feedback simulation
                if (navigator.vibrate) navigator.vibrate(50);
            }
        }
    </script>
